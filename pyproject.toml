[project]
name = "forrovivo-linguistic-research-api"
version = "2.2.0"
description = "Read-only API for isolated ForroVivo linguistic datasets"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
]

[tool.vercel]
entrypoint = "api.main:app"
