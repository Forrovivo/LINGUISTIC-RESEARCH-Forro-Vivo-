name: Verify ForroVivo API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-api.yml"
  pull_request:
    paths:
      - "api/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies
        run: npm ci --prefix api
      # Production deploy is Cloudflare Workers Builds (push to main).
      # This job only proves the Worker bundle builds without Cloudflare credentials.
      - name: Dry-run Worker bundle
        run: npx --prefix api wrangler deploy --dry-run --outdir /tmp/worker-bundle --config wrangler.jsonc
